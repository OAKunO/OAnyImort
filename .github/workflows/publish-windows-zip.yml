name: Publish Windows ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version, without v
        required: true
        default: '1.1.1'
      sha256:
        description: Expected ZIP SHA-256
        required: true
        default: '6feea98aa4f25ea892ce9ba1b1e9f2ccc6c04af42ef375bd79dd45272feff7cf'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the unsigned distribution
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          name="OAnyImport-Windows-${RELEASE_VERSION}-x64.zip"
          gh release view "v${RELEASE_VERSION}" >/dev/null
          curl --fail --location --retry 3 --output "$name" "https://oakuno.com/downloads/oanyimport/$name"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$name" > "$name.sha256"
          sha256sum --check "$name.sha256"
          unzip -t "$name"
          unzip -Z1 "$name" | grep -Fx 'OAnyImport-Windows/Setup.exe'
      - name: Complete the verified release assets
        shell: bash
        run: |
          set -euo pipefail
          name="OAnyImport-Windows-${RELEASE_VERSION}-x64.zip"
          setup="OAnyImport-Setup-${RELEASE_VERSION}-x64.exe"
          mac="OAnyImport-macOS-${RELEASE_VERSION}-universal.zip"
          source="OAnyImport-${RELEASE_VERSION}-source.zip"
          checksums="OAnyImport-${RELEASE_VERSION}-SHA256SUMS.txt"
          unzip -p "$name" 'OAnyImport-Windows/Setup.exe' > "$setup"
          gh release download "v${RELEASE_VERSION}" --pattern "$mac"
          git archive --format=zip --prefix="OAnyImport-${RELEASE_VERSION}/" --output="$source" HEAD
          sha256sum "$source" "$setup" "$name" "$mac" > "$checksums"
          gh release upload "v${RELEASE_VERSION}" "$source" "$setup" "$name" "$name.sha256" "$checksums" --clobber
          mkdir public-check
          gh release download "v${RELEASE_VERSION}" --pattern "$name" --dir public-check
          cd public-check
          printf '%s  %s\n' "$EXPECTED_SHA256" "$name" | sha256sum --check
