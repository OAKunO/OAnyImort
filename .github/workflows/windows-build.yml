name: Windows release build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test application
        run: |
          python -m pip install -r Windows/requirements.txt
          python -m unittest discover -s Windows -p "test_*.py" -v
      - name: Download pinned Windows runtime and Qt wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Windows/.downloads/qt | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/winpython/winpython/releases/download/2026-04/WinPython64-3.13.18.0dot.zip' -OutFile Windows/.downloads/winpython.zip
          $expected = '50c4f17809457e411c2db30959c8fb25a958ff3a6f624080044992809509bc37'
          if ((Get-FileHash Windows/.downloads/winpython.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Pinned Python download failed integrity verification.' }
          python -m pip download --only-binary=:all: --platform win_amd64 --python-version 313 --implementation cp --abi abi3 --dest Windows/.downloads/qt PySide6-Essentials==6.8.3 PySide6-Addons==6.8.3
      - name: Locate or install NSIS
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler was not installed.' }
          "OANYIMPORT_MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build self-contained installer
        run: python Windows/build_installer.py --makensis "${{ env.OANYIMPORT_MAKENSIS }}"
      - name: Install and launch-check the self-contained package
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'Windows'); import build_installer; print(build_installer.VERSION)"
          $name = "OAnyImport-Setup-$version-x64.exe"
          $setup = (Resolve-Path "Windows/dist/$name").Path
          $published = Join-Path $env:RUNNER_TEMP $name
          $release = "https://github.com/OAKunO/OAnyImport/releases/download/v$version"
          try {
            Invoke-WebRequest -Uri "$release/$name" -OutFile $published
            $checksumFile = Join-Path $env:RUNNER_TEMP 'OAnyImport-checksums.txt'
            Invoke-WebRequest -Uri "$release/OAnyImport-$version-SHA256SUMS.txt" -OutFile $checksumFile
            $checksums = Get-Content -Raw -Encoding utf8 $checksumFile
            $entry = ($checksums -split "`n" | Where-Object { $_.Trim().EndsWith($name) })
            if (-not $entry) { throw 'Published installer checksum is missing.' }
            $expected = ($entry -split '\s+')[0].ToLowerInvariant()
            if ((Get-FileHash $published -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Published installer checksum differs.' }
            $setup = $published
            Write-Host 'Testing the actual published installer.'
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            Write-Host 'No published installer for this version yet; testing the build candidate.'
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'OAnyImport-installed'
          $installer = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          if (-not (Test-Path "$installRoot/OAnyImport.exe")) { throw 'Installed launcher is missing.' }
          $env:OANYIMPORT_TEST_INSTALL = $installRoot
          $code = @'
          import os, sys
          from pathlib import Path
          root = Path(os.environ['OANYIMPORT_TEST_INSTALL'])
          sys.path.insert(0, str(root))
          import PySide6
          assert Path(PySide6.__file__).is_relative_to(root), 'Used a Qt installation outside the packaged runtime'
          from PySide6.QtWidgets import QApplication
          from app import App
          app = QApplication([])
          window = App(settings=False)
          window.show()
          app.processEvents()
          assert window.windowTitle() == 'OAnyImport'
          window.close()
          app.processEvents()
          print('Installed package UI opened and closed using bundled Python and Qt.')
          '@
          & "$installRoot/runtime/python.exe" -I -B -c $code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned build for validation and future signing
        uses: actions/upload-artifact@v4
        with:
          name: OAnyImport-Windows-unsigned
          path: |
            Windows/dist/OAnyImport-Setup-*-x64.exe
            Windows/dist/OAnyImport-Windows-*-x64.zip
            Windows/dist/build-manifest.json
          if-no-files-found: error
